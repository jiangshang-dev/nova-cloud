# =========================================================
# MySQL —— 对齐 Jeecg：spring.datasource.dynamic
# 复制到 Nacos：DataId = application-mysql.yml
# 激活：SPRING_PROFILES_ACTIVE=dev,mysql
#
# 只配 master = 单库；再配 slave = 从库（@DS("slave") 或读写组件）
# 分片：取消注释 sharding-db，并提供 classpath:sharding.yaml
# =========================================================
nova:
  datasource:
    db-type: mysql

spring:
  datasource:
    druid:
      stat-view-servlet:
        enabled: true
        loginUsername: admin
        loginPassword: 123456
        allow:
      web-stat-filter:
        enabled: true
    dynamic:
      primary: master
      strict: false
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 1000
        maxWait: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        wall:
          selectWhereAlwayTrueCheck: false
        stat:
          merge-sql: false
          slow-sql-millis: 5000
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:nova_cloud}?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          username: ${MYSQL_USERNAME:root}
          password: ${MYSQL_PASSWORD:root}
          driver-class-name: com.mysql.cj.jdbc.Driver
        # 从库（可选）：不配则全部走 master
        # slave:
        #   url: jdbc:mysql://127.0.0.1:3307/nova_cloud?characterEncoding=UTF-8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        #   username: root
        #   password: root
        #   driver-class-name: com.mysql.cj.jdbc.Driver
