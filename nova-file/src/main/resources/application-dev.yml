# =========================================================
# 本地备份配置（与 Nacos 中配置内容保持一致）
# 复制到 Nacos：
#   DataId   = nova-file-dev.yml
#   Group    = DEFAULT_GROUP
#   Namespace= nova-cloud
#   格式     = YAML
# 注意：文件服务器（local/minio/rustfs/oss）在管理后台配置，不要写在此处
# =========================================================
server:
  port: 8082

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/nova_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

nova:
  security:
    jwt:
      secret: NovaCloudJwtSecretKeyChangeMePlease32
      expire-seconds: 7200
      issuer: nova-cloud

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.nova: info
