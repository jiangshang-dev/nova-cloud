# =========================================================
# MySQL（平台服务默认单库）
# 复制到 Nacos：DataId = application-mysql.yml
# 激活：SPRING_PROFILES_ACTIVE=dev,mysql
#
# 需要分库分表时：mode 改为 sharding，并配置 nova.sharding（参考 nova-demo）
# =========================================================
nova:
  datasource:
    db-type: mysql
    mode: single

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:nova_cloud}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

