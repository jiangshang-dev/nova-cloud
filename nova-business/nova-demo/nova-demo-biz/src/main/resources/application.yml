# =========================================================
# 仅保留：应用名 / Profile 组合 / Nacos 连接
#
# 功能配置：
#   application-common.yml / application-security.yml
#   application-redis.yml / application-mq.yml
# 数据库（Profile 切换，业务只写连接 + db-type）：
#   application-mysql.yml | application-pg.yml
#   application-oracle.yml | application-dm.yml
#
# 切换示例：
#   SPRING_PROFILES_ACTIVE=dev,mysql
#   SPRING_PROFILES_ACTIVE=dev,pg
#   SPRING_PROFILES_ACTIVE=dev,oracle
#   SPRING_PROFILES_ACTIVE=dev,dm
# =========================================================
spring:
  application:
    name: nova-demo
  profiles:
    group:
      dev:
        - common
        - security
        - redis
        - mq
    active: ${SPRING_PROFILES_ACTIVE:dev,mysql}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: true
        namespace: ${NACOS_NAMESPACE:nova-cloud}
        group: DEFAULT_GROUP
      config:
        enabled: true
        namespace: ${NACOS_NAMESPACE:nova-cloud}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
  config:
    import:
      - optional:nacos:${spring.application.name}-dev.${spring.cloud.nacos.config.file-extension}
      - optional:nacos:application-common.yml
      - optional:nacos:application-security.yml
      - optional:nacos:application-redis.yml
      - optional:nacos:application-mq.yml
      - optional:nacos:application-mysql.yml
#      - optional:nacos:application-pg.yml
#      - optional:nacos:application-oracle.yml
#      - optional:nacos:application-dm.yml
