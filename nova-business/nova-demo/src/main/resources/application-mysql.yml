# =========================================================
# MySQL
# 复制到 Nacos：DataId = application-mysql.yml
# 激活：SPRING_PROFILES_ACTIVE=dev,mysql
#
# mode=sharding 时由 ShardingSphere 接管 DataSource（勿再配 spring.datasource）
# 先执行 sql/07_nova_demo.sql
# =========================================================
nova:
  datasource:
    db-type: mysql
    mode: sharding
  sharding:
    sql-show: true
    datasources:
      ds0:
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:nova_cloud}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_PASSWORD:root}
        maximum-pool-size: 10
        minimum-idle: 2
      # 主从：mode 改为 sharding-read-write 并配置从库
      # ds0_slave:
      #   driver-class-name: com.mysql.cj.jdbc.Driver
      #   jdbc-url: jdbc:mysql://127.0.0.1:3307/nova_cloud?...
      #   username: root
      #   password: root
    readwrite-splitting:
      name: readwrite_ds
      write-data-source-name: ds0
      read-data-source-names:
        - ds0_slave
      load-balancer-name: round_robin
      load-balancer-type: ROUND_ROBIN
    tables:
      demo_order:
        actual-data-nodes: ds0.demo_order_$->{0..1}
        table-strategy:
          sharding-column: user_id
          sharding-algorithm-name: demo-order-inline
    sharding-algorithms:
      demo-order-inline:
        type: INLINE
        props:
          algorithm-expression: demo_order_$->{user_id % 2}
    key-generators:
      snowflake:
        type: SNOWFLAKE

