# =========================================================
# 本地备份配置（与 Nacos 中配置内容保持一致）
# 复制到 Nacos：
#   DataId   = nova-demo-dev.yml
#   Group    = DEFAULT_GROUP
#   Namespace= nova-cloud
#   格式     = YAML
# =========================================================
server:
  port: 8090

spring:
  # ---------- RabbitMQ 连接（标准 Spring Boot 配置）----------
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
  # 开启 nova.sharding 后由 ShardingSphere 接管 DataSource，勿再配 spring.datasource
  # datasource:
  #   url: jdbc:mysql://127.0.0.1:3306/nova_cloud?...
  #   username: root
  #   password: root

nova:
  security:
    jwt:
      secret: NovaCloudJwtSecretKeyChangeMePlease32
      expire-seconds: 7200
      issuer: nova-cloud
  # ---------- Nova MQ（nova-mq-spring-boot-starter）----------
  mq:
    enabled: true
    direct-exchange: nova.direct.exchange
    delay-exchange: nova.delayed.exchange
    concurrent-consumers: 1
    max-concurrent-consumers: 1
    prefetch: 1
    default-requeue-rejected: true
  # ---------- ShardingSphere（nova-shardingsphere-spring-boot-starter）----------
  # 先执行 sql/07_nova_demo.sql 创建 demo_order_0 / demo_order_1
  sharding:
    # 总开关：false 时改回 spring.datasource 普通单库
    enabled: true
    sql-show: true
    datasources:
      ds0:
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:3306/nova_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        username: root
        password: root
        maximum-pool-size: 10
        minimum-idle: 2
      # 主从示例：开启 readwrite-splitting 时再配置从库
      # ds0_slave:
      #   driver-class-name: com.mysql.cj.jdbc.Driver
      #   jdbc-url: jdbc:mysql://127.0.0.1:3307/nova_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      #   username: root
      #   password: root
    # 主从读写分离开关（可关）：true 时需配置 write/read 数据源，且分片 actual-data-nodes 用逻辑名
    readwrite-splitting:
      enabled: false
      name: readwrite_ds
      write-data-source-name: ds0
      read-data-source-names:
        - ds0_slave
      load-balancer-name: round_robin
      load-balancer-type: ROUND_ROBIN
    tables:
      demo_order:
        # 关闭主从用 ds0；开启主从改为 readwrite_ds.demo_order_$->{0..1}
        actual-data-nodes: ds0.demo_order_$->{0..1}
        table-strategy:
          sharding-column: user_id
          sharding-algorithm-name: demo-order-inline
    sharding-algorithms:
      demo-order-inline:
        type: INLINE
        props:
          algorithm-expression: demo_order_$->{user_id % 2}
    key-generators:
      snowflake:
        type: SNOWFLAKE

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.nova: info
    com.nova.mq: debug
    com.nova.demo.mq: debug
    com.nova.sharding: debug
    org.apache.shardingsphere: info
