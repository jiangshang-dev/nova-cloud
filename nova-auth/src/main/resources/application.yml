server:
  port: 9000

spring:
  application:
    name: nova-auth
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/nova_cloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

nova:
  security:
    jwt:
      secret: NovaCloudJwtSecretKeyChangeMePlease32
      expire-seconds: 7200
      issuer: nova-cloud
  mail:
    enabled: true
    account:
      host: smtp.example.com
      port: 465
      auth: true
      sslEnable: true
      from: noreply@example.com
      user: noreply@example.com
      pass: change-me
  auth:
    email-code:
      expire-minutes: 5
      retry-seconds: 60
      length: 6
      title: NovaCloud 验证码

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.nova: info
